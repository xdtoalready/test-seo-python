version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seo-analyzer-api
    ports:
      - "8000:8000"
    volumes:
      # Hot reload для разработки
      - .:/app
      - logs-data:/app/logs
      - reports-data:/app/reports
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - STORAGE_BACKEND=postgres
      - DATABASE_URL=postgresql+asyncpg://seo_user:seo_password@postgres:5432/seo_analyzer
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - seo-network

  postgres:
    image: postgres:16-alpine
    container_name: seo-analyzer-postgres
    environment:
      POSTGRES_DB: seo_analyzer
      POSTGRES_USER: seo_user
      POSTGRES_PASSWORD: seo_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo_user -d seo_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - seo-network

volumes:
  logs-data:
  reports-data:
  postgres-data:

networks:
  seo-network:
    driver: bridge