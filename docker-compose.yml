version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seo-analyzer-api
    ports:
      - "8000:8000"
    volumes:
      # Hot reload для разработки
      - .:/app
      - logs-data:/app/logs
      - reports-data:/app/reports
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - STORAGE_BACKEND=memory
    restart: unless-stopped
    networks:
      - seo-network

volumes:
  logs-data:
  reports-data:

networks:
  seo-network:
    driver: bridge