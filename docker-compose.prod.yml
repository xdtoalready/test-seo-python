version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seo-analyzer-api
    ports:
      - "8000:8000"
    volumes:
      # В production НЕ монтируем код (без hot reload)
      - logs-data:/app/logs
      - reports-data:/app/reports
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - STORAGE_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always
    networks:
      - seo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: seo-analyzer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-changeme}"
    restart: always
    networks:
      - seo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL (закомментировано, для будущего)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: seo-analyzer-postgres
  #   ports:
  #     - "5432:5432"
