version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seo-analyzer-api
    ports:
      - "8001:8000"
    volumes:
      # В production НЕ монтируем код (без hot reload)
      - logs-data:/app/logs
      - reports-data:/app/reports
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      # STORAGE_BACKEND и DATABASE_URL берутся из .env файла
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - seo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: seo-analyzer-postgres
    ports:
      - "5433:5432"  # 5433 на хосте чтобы не конфликтовать с другими PostgreSQL
    environment:
      POSTGRES_DB: seo_analyzer
      POSTGRES_USER: seo_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always
    networks:
      - seo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo_user -d seo_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  logs-data:
  reports-data:
  postgres-data:

networks:
  seo-network:
    driver: bridge
